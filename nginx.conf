# Static hosting for Fretwork. no-store keeps a self-hosted copy always current;
# the service worker (network-first) provides offline use.
server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;

    # the stock mime.types has no entry for .webmanifest
    types { application/manifest+json webmanifest; }

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml;

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        etag off;
        if_modified_since off;
        try_files $uri $uri/ =404;
    }
}
