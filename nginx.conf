# Static hosting for Fretwork. no-store keeps a self-hosted copy always current;
# the service worker (network-first) provides offline use.
server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript text/css application/json application/manifest+json image/svg+xml;

    # The stock mime.types has no entry for .webmanifest. (A `types {}` block here
    # would REPLACE the whole mime table, not extend it - everything would then be
    # served as a download - so give just this one file type its own type.)
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        etag off;
        if_modified_since off;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        etag off;
        if_modified_since off;
        try_files $uri $uri/ =404;
    }
}
