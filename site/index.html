<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretwork - guitar and ukulele theory toolkit</title>
<meta name="description" content="Scales, chords and chord progressions on the fretboard for guitar and ukulele: positions, voicings, a chord builder and a scale finder for any progression. Works offline.">
<meta name="theme-color" content="#E6E9E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141716" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Fretwork">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fretwork">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/familjen-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">Fretwork</span>
    <div class="seg" id="instrument-switch" role="group" aria-label="Instrument">
      <button type="button" data-inst="guitar" aria-pressed="true">Guitar</button>
      <button type="button" data-inst="ukulele" aria-pressed="false">Ukulele</button>
    </div>
  </header>
  <div class="optbar" id="optbar" role="group" aria-label="Instrument setup">
    <label>Tuning <select id="tuning-select"></select></label>
    <label>Capo <select id="capo-select"></select></label>
    <label class="chk"><input type="checkbox" id="lefty-toggle"> Left-handed</label>
  </div>
  <div class="shell">
    <nav class="tabbar" aria-label="Tools">
      <a href="#progressions" class="tab" data-tab="progressions"><span class="ic" aria-hidden="true">&#9834;</span>Progressions</a>
      <a href="#scales" class="tab" data-tab="scales"><span class="ic" aria-hidden="true">&#9835;</span>Scales</a>
      <a href="#chords" class="tab" data-tab="chords"><span class="ic" aria-hidden="true">&#9833;</span>Chords</a>
    </nav>
    <main class="views">
      <section id="view-progressions" class="view" hidden></section>
      <section id="view-scales" class="view" hidden></section>
      <section id="view-chords" class="view" hidden></section>
    </main>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
