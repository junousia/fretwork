name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check (TypeScript over JSDoc, no build)
        run: npm run typecheck
      - name: Theory, arpeggio, tuning, golden and shipped-site checks
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test (root, subpath, offline)
        run: npm run test:e2e
      - name: Accessibility (axe) and PWA installability
        run: npm run test:a11y

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lighthouse (performance, accessibility, best practices, SEO >= thresholds in lighthouserc.json)
        run: npx --yes @lhci/cli@0.15 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
