name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Theory and shipped-site checks
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test (root, subpath, offline)
        run: npm run test:e2e
